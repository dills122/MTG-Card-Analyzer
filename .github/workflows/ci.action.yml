name: CI

on:
    push:
        branches:
            - master
            - main
    pull_request:
        branches:
            - master
            - main

permissions:
    contents: read
    pull-requests: read
jobs:
    pr_job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 3

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint + Format + Types
              run: pnpm check:fast

            - name: Test
              run: pnpm test
    dot_only_linter_job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 3

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - run: chmod +x "${GITHUB_WORKSPACE}/.github/scripts/dot-only-test-linter.sh"
            - run: '"${GITHUB_WORKSPACE}/.github/scripts/dot-only-test-linter.sh"'
    regression_job:
        name: Cold-cache OCR regression
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run cold-cache regression gate
              run: pnpm test:regression

            - name: Upload regression benchmark
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: mtg-regression-${{ github.run_id }}
                  path: artifacts/regression/
                  if-no-files-found: warn
                  retention-days: 14
    automerge:
        needs: [pr_job, dot_only_linter_job, regression_job]
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Merge Dependabot PR
              uses: actions/github-script@v7
              with:
                  script: |
                      const pr = context.payload.pull_request;
                      if (!pr) {
                        core.setFailed("No pull request payload found.");
                        return;
                      }

                      await github.rest.pulls.merge({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: pr.number,
                        merge_method: "squash"
                      });
