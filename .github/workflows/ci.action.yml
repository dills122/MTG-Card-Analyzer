name: CI

on:
    push:
        branches:
            - master
            - main
    pull_request:
        branches:
            - master
            - main

permissions:
    contents: read
    pull-requests: read
jobs:
    quality_matrix:
        name: Quality (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["22"]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 3

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint + Format + Types
              run: pnpm check:fast

            - name: Test + Coverage gate
              run: pnpm coverage:check

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: mtg-coverage-node-${{ matrix.node-version }}-${{ github.run_id }}
                  path: coverage/
                  if-no-files-found: warn
                  retention-days: 14
    pr_job:
        name: pr_job
        needs: quality_matrix
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Require the Node quality matrix
              env:
                  QUALITY_MATRIX_RESULT: ${{ needs.quality_matrix.result }}
              run: |
                  if [ "$QUALITY_MATRIX_RESULT" != "success" ]; then
                    echo "::error::Quality matrix result: $QUALITY_MATRIX_RESULT"
                    exit 1
                  fi
    dot_only_linter_job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 3

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - run: chmod +x "${GITHUB_WORKSPACE}/.github/scripts/dot-only-test-linter.sh"
            - run: '"${GITHUB_WORKSPACE}/.github/scripts/dot-only-test-linter.sh"'
    regression_shards:
        name: OCR correctness (shard ${{ matrix.shard }}/3)
        runs-on: ubuntu-latest
        timeout-minutes: 12
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run cold-cache correctness shard
              run: >-
                  pnpm test:regression
                  --shard "${{ matrix.shard }}/3"
                  --workers 2
                  --runtime-policy report-only
                  --output "artifacts/regression/shard-${{ matrix.shard }}"

            - name: Upload regression benchmark
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: mtg-regression-${{ github.run_id }}-shard-${{ matrix.shard }}
                  path: artifacts/regression/shard-${{ matrix.shard }}/
                  if-no-files-found: warn
                  retention-days: 14
    regression_job:
        name: Cold-cache OCR regression
        needs: regression_shards
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 1
        steps:
            - name: Require every correctness shard
              env:
                  REGRESSION_SHARDS_RESULT: ${{ needs.regression_shards.result }}
              run: |
                  if [ "$REGRESSION_SHARDS_RESULT" != "success" ]; then
                    echo "::error::OCR correctness shards result: $REGRESSION_SHARDS_RESULT"
                    exit 1
                  fi
    performance_job:
        name: OCR performance smoke
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run isolated OCR performance gate
              run: >-
                  pnpm test:regression
                  --workers 1
                  --runtime-policy strict
                  --case mmq-99-saprazzan-heir-0e3d913d-scryfall
                  --case dmu-382-yavimaya-coast-79aa9c09-scryfall
                  --case plc-114-rough-tumble-0c93c9a0-scryfall
                  --output artifacts/regression/performance

            - name: Upload performance benchmark
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: mtg-regression-performance-${{ github.run_id }}
                  path: artifacts/regression/performance/
                  if-no-files-found: warn
                  retention-days: 14
    automerge:
        needs: [pr_job, dot_only_linter_job, regression_job, performance_job]
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Merge Dependabot PR
              uses: actions/github-script@v7
              with:
                  script: |
                      const pr = context.payload.pull_request;
                      if (!pr) {
                        core.setFailed("No pull request payload found.");
                        return;
                      }

                      await github.rest.pulls.merge({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: pr.number,
                        merge_method: "squash"
                      });
